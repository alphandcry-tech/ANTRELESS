<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <title>AntreLess - Dashboard Penjual</title>
</head>

<body>
    <div class="page">

        <!-- ================= NAVBAR ================= -->
        <header class="navbar">
            <a class="btn-back" href="login.html" aria-label="Kembali">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M10 8V4L2 12l8 8v-4.2c5.6 0 9.3 1.5 12 5.2-1-6.6-4.6-12.2-12-13z" />
                </svg>
            </a>
            <span class="brand">Antre<span class="accent">Less</span></span>
             </header>

        <!-- ================= MAIN ================= -->
        <main class="content">

            <!-- Kotak putih di belakang logo/foto + nama + email penjual -->
            <div class="seller-box">
                <div class="seller-avatar">
                    <img src="asset/profil/foto-profil.jpeg" alt="Foto profil penjual">
                </div>
                <div class="seller-info">
                    <p class="seller-name">Akbar</p>
                    <p class="seller-email">mys***@gmail.com</p>
                </div>
            </div>

            <h2 class="section-title">Daftar Pesanan</h2>

            <div id="order-list" class="order-list">
                <div class="order-item" data-price="10000">
                    <div class="order-img">
                        <img src="asset/dapur rasa/geprek.jpeg" alt="Nasi Geprek">
                    </div>
                    <div class="order-info">
                        <p class="order-name">Nasi Geprek</p>
                        <p class="order-price">10.000</p>
                    </div>
                    <button type="button" class="check-box" role="checkbox" aria-checked="false" aria-label="Tandai pesanan Nasi Geprek">
                        <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
                            <path d="M4 12l6 6L20 6" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>

            <p id="empty-state" class="empty-state" hidden>Belum ada pesanan baru.</p>
        </main>

        <!-- ================= FOOTER TOTAL & KONFIRMASI ================= -->
        <footer class="summary-bar">
            <div class="summary-total">
                <span class="summary-label">Total</span>
                <span id="total-amount" class="summary-amount">0</span>
            </div>
            <button type="button" id="btn-konfirmasi" class="btn-konfirmasi">Konfirmasi</button>
        </footer>
    </div>

    <script src="dashboard.js" defer></script>
</body>

</html>
