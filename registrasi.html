<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registrasi.css">
    <title>AntreLess - Daftar Akun</title>
</head>

<body>
    <div class="page">

        <!-- ================= NAVBAR ================= -->
        <header class="navbar">
            <div class="brand-group">
                <div class="brand-logo">
                    <img src="asset/profil/foto-profil.jpeg" alt="Logo AntreLess">
                </div>
                <span class="brand">Antre<span class="accent">Less</span></span>
            </div>
        </header>

        <!-- ================= MAIN ================= -->
        <main class="auth-main">
            <div class="auth-card">
                <a href="login.html" class="link-back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M10 8V4L2 12l8 8v-4.2c5.6 0 9.3 1.5 12 5.2-1-6.6-4.6-12.2-12-13z" />
                    </svg>
                    Kembali ke login
                </a>

                <form id="registrasi-form" class="auth-form" novalidate>
                    <div class="field">
                        <label for="nama">Nama Lengkap</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke-linecap="round" />
                            </svg>
                            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda">
                        </div>
                    </div>

                    <div class="field">
                        <label for="email">Alamat Email</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M4 4h16v16H4z" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M4 6l8 7 8-7" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email">
                        </div>
                    </div>

                    <div class="field">
                        <label for="password">Kata Sandi</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <rect x="5" y="11" width="14" height="9" rx="2" />
                                <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round" />
                            </svg>
                            <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="new-password">
                            <button type="button" class="btn-eye" data-target="password" aria-label="Tampilkan kata sandi" aria-pressed="false">
                                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round" stroke-linejoin="round" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke-linecap="round" stroke-linejoin="round" />
                                    <path d="M1 1l22 22" stroke-linecap="round" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="konfirmasi-password">Konfirmasi Kata Sandi</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <rect x="5" y="11" width="14" height="9" rx="2" />
                                <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round" />
                            </svg>
                            <input type="password" id="konfirmasi-password" name="konfirmasi_password" placeholder="Ulangi kata sandi" autocomplete="new-password">
                            <button type="button" class="btn-eye" data-target="konfirmasi-password" aria-label="Tampilkan kata sandi" aria-pressed="false">
                                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round" stroke-linejoin="round" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke-linecap="round" stroke-linejoin="round" />
                                    <path d="M1 1l22 22" stroke-linecap="round" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="username">Username</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke-linecap="round" />
                            </svg>
                            <input type="text" id="username" name="username" placeholder="Masukkan username">
                        </div>
                    </div>

                    <label class="agree-row" for="agree-checkbox">
                        <button type="button" class="check-box" id="agree-checkbox" role="checkbox" aria-checked="false">
                            <svg class="check-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
                                <path d="M4 12l6 6L20 6" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                        <span>Saya menyetujui <a href="#">Syarat &amp; Ketentuan</a> serta <a href="#">Kebijakan Privasi</a></span>
                    </label>

                    <button type="submit" class="btn-submit">Konfirmasi</button>
                </form>
            </div>
        </main>
    </div>

    <script src="registrasi.js" defer></script>
</body>

</html>
